nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: registry.clbs.io/clbs-io/cloudflare-tunnel-ingress-controller/main
  tag:
  pullPolicy: IfNotPresent
  pullSecrets: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Extra controller flags, for example ["--resync-period=5m"]
extraArgs: []

ingressClass:
  name: cloudflare-tunnel
  controller: clbs.io/cloudflare-tunnel-ingress-controller
  isDefaultClass: false

config:
  cloudflare:
    accountID: ""
    tunnelName: ""

    apiToken:
      existingSecret:
        name: cloudflare-api-token
        key: token

  kubernetesApiTunnel:
    enabled: false
    server: kubernetes.default.svc:443
    domain: domain.example.com
    cloudflareAccessAppName: "Kubernetes API Tunnel"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

cloudflared:
  image: cloudflare/cloudflared:2026.9.1
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  # cloudflared tunnel flags, for example ["--protocol=quic", "--loglevel=warn"]
  extraArgs: []
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Longer than cloudflared's 30s --grace-period, so connections drain
  terminationGracePeriodSeconds: 45
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Empty: spread replicas across nodes when possible
  topologySpreadConstraints: []
  priorityClassName: ""
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  podMonitor:
    enabled: false
    interval: 30s
    labels: {}
