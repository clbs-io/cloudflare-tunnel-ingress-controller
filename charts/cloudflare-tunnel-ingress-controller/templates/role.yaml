apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloudflare-tunnel-ingress-controller.fullname" . }}-cloudflared
  labels:
    {{- include "cloudflare-tunnel-ingress-controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ include "cloudflare-tunnel-ingress-controller.tunnelTokenSecretName" . }}
    verbs:
      - get
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - {{ include "cloudflare-tunnel-ingress-controller.cloudflaredName" . }}
    verbs:
      - get
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - cloudflare-tunnel-cloudflared
    verbs:
      - get
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
