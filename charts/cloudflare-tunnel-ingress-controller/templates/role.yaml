{{- /*
Permissions in the controller's namespace. Secrets and Deployments are read
straight from the API server, never cached, so each rule is pinned to one
object by name except Secret creation, which cannot be limited by name.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloudflare-tunnel-ingress-controller.fullname" . }}-cloudflared
  labels:
    {{- include "cloudflare-tunnel-ingress-controller.labels" . | nindent 4 }}
rules:
  {{- /* Create the tunnel token Secret the cloudflared pods mount. */}}
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  {{- /* Keep the token Secret equal to the tunnel token. */}}
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ include "cloudflare-tunnel-ingress-controller.tunnelTokenSecretName" . }}
    verbs:
      - get
      - update
  {{- /*
  Read the cloudflared Deployment's availability and roll its pods through a
  pod-template annotation when the token changes.
  */}}
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - {{ include "cloudflare-tunnel-ingress-controller.cloudflaredName" . }}
    verbs:
      - get
      - patch
  {{- /*
  Delete the legacy cloudflared Deployment created by the controller rather
  than the chart, once the chart's Deployment is available.
  */}}
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - cloudflare-tunnel-cloudflared
    verbs:
      - get
      - delete
  {{- /* Leader election. */}}
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
  {{- /* Leader-election Events. */}}
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
