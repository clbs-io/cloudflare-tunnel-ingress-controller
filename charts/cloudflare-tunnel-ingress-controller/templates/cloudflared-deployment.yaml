{{- /*
cloudflared, the tunnel connector. Every replica connects the same tunnel;
the ingress rules come from the Cloudflare API, the token from the Secret the
controller writes.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudflare-tunnel-ingress-controller.cloudflaredName" . }}
  labels:
    {{- include "cloudflare-tunnel-ingress-controller.cloudflaredLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.cloudflared.replicas }}
  {{- /* Start a new connector before stopping an old one, so a rollout never
  leaves the tunnel without one. */}}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "cloudflare-tunnel-ingress-controller.cloudflaredSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudflare-tunnel-ingress-controller.cloudflaredSelectorLabels" . | nindent 8 }}
        {{- with .Values.cloudflared.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.cloudflared.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- /* cloudflared never talks to the Kubernetes API. */}}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.cloudflared.terminationGracePeriodSeconds }}
      {{- with .Values.cloudflared.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cloudflared.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.cloudflared.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cloudflared
          image: {{ include "cloudflare-tunnel-ingress-controller.cloudflaredImage" . | quote }}
          imagePullPolicy: {{ include "cloudflare-tunnel-ingress-controller.cloudflaredImagePullPolicy" . }}
          {{- /*
          The image entrypoint is `cloudflared --no-autoupdate`. extraArgs are
          flags of the tunnel command, so they go before `run`. The token comes
          from the mounted file, never from the command line.
          */}}
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:9090
            {{- range .Values.cloudflared.extraArgs }}
            - {{ . | quote }}
            {{- end }}
            - run
            - --token-file
            - /etc/cloudflared/token
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          {{- /*
          /ready succeeds only while connected to the Cloudflare edge;
          /healthcheck only checks the process, so an edge outage marks pods
          unready without restarting them.
          */}}
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          {{- with .Values.cloudflared.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cloudflared.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tunnel-token
              mountPath: /etc/cloudflared
              readOnly: true
      {{- /* Written by the controller; pods wait for it on a first install. */}}
      volumes:
        - name: tunnel-token
          secret:
            secretName: {{ include "cloudflare-tunnel-ingress-controller.tunnelTokenSecretName" . }}
            # 0444: pod-private tmpfs, readable without fsGroup
            defaultMode: 292
            items:
              - key: token
                path: token
      topologySpreadConstraints:
        {{- if .Values.cloudflared.topologySpreadConstraints }}
        {{- toYaml .Values.cloudflared.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cloudflare-tunnel-ingress-controller.cloudflaredSelectorLabels" . | nindent 14 }}
        {{- end }}
      {{- with .Values.cloudflared.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cloudflared.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cloudflared.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
