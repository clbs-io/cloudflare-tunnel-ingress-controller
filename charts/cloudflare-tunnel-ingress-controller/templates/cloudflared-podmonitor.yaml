{{- /* Needs the Prometheus Operator CRDs (monitoring.coreos.com). */ -}}
{{- if .Values.cloudflared.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "cloudflare-tunnel-ingress-controller.cloudflaredName" . }}
  labels:
    {{- include "cloudflare-tunnel-ingress-controller.cloudflaredLabels" . | nindent 4 }}
    {{- with .Values.cloudflared.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "cloudflare-tunnel-ingress-controller.cloudflaredSelectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.cloudflared.podMonitor.interval }}
{{- end }}
