{{- /*
Cluster-wide permissions of the controller. Its reads come from informer
caches, hence list and watch next to get.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloudflare-tunnel-ingress-controller.fullname" . }}-watch-ingresses
  labels:
    {{- include "cloudflare-tunnel-ingress-controller.labels" . | nindent 4 }}
rules:
  {{- /* Resolve named Service ports in Ingress backends. */}}
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
  {{- /* Watch Ingresses and patch the controller's finalizer onto them. */}}
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
      - patch
  {{- /* Publish the served hostnames in .status.loadBalancer. */}}
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses/status
    verbs:
      - patch
  {{- /*
  Tell Ingresses of another installation of this controller apart from
  Ingresses moved to a foreign class.
  */}}
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingressclasses
    verbs:
      - get
      - list
      - watch
  {{- /* Warning Events on Ingresses whose content cannot be published. */}}
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
